services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smarthome
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smarthome"]
      interval: 5s
      timeout: 5s
      retries: 10
  emqx:
    image: emqx/emqx:5.8.6
    ports:
      - "1883:1883"
      - "18083:18083"
    healthcheck:
      test: ["CMD-SHELL", "emqx ctl status"]
      interval: 10s
      timeout: 10s
      retries: 10
volumes:
  postgres_data:
